{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Ghausia Dyeing{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Nastaliq+Urdu:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=mill14" rel="stylesheet">
    <link href="{% static 'css/mill.css' %}?v=mill14" rel="stylesheet">
</head>
<body class="{% if user.is_authenticated %}app-shell has-mobile-dock{% else %}is-guest{% endif %}">
    {% include "includes/navbar.html" %}
    <div class="app-frame">
        <main class="container-fluid app-main">
            {% include "includes/messages.html" %}
            {% block content %}{% endblock %}
        </main>
        <footer class="app-footer">
            <span>Ghausia Dyeing</span>
            <span>Cloth processing</span>
        </footer>
    </div>
    {% include "includes/mobile_quick.html" %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
