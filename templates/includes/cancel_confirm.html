{% extends "base.html" %}
{% block title %}Cancel Record - Ghausia Dyeing{% endblock %}
{% block content %}
<div class="record">
    <div class="page-header-block">
        <h1 class="page-title">Cancel record</h1>
        <p class="page-subtitle">{{ object_label }} stays in the books, marked cancelled.</p>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% include "includes/form_errors.html" %}
                <div class="mb-3">
                    <label class="form-label">{{ form.cancellation_reason.label }}</label>
                    {{ form.cancellation_reason }}
                </div>
                <button type="submit" class="btn btn-cancel-record">Confirm cancel</button>
                <a href="javascript:history.back()" class="btn btn-outline-secondary ms-2">Go back</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
