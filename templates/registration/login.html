{% extends "base.html" %}
{% block title %}Sign In - Textile Factory ERP{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card card">
        <div class="login-header">
            <div class="mb-2"><i class="bi bi-building-gear" style="font-size:2.5rem;"></i></div>
            <h1>Textile Factory ERP</h1>
            <p>Sign in to manage production and inventory</p>
        </div>
        <div class="login-body">
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger py-2">
                    <i class="bi bi-exclamation-triangle me-1"></i> Invalid username or password. Please try again.
                </div>
                {% endif %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
